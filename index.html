    <script>
      (function() {
        // Suppress benign Vite dev server WebSocket disconnect error in AI Studio sandbox
        const origError = console.error;
        console.error = function(...args) {
          const text = args.map(a => (a && a.stack ? a.stack : (a && a.message ? a.message : String(a)))).join(' ');
          if (text.includes('WebSocket') || text.includes('@vite/client') || text.includes('[vite]')) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          const msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (msg.includes('WebSocket') || msg.includes('vite')) {
            e.preventDefault?.();
            e.stopImmediatePropagation?.();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          const msg = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          if (msg.includes('WebSocket') || msg.includes('vite')) {
            e.preventDefault?.();
            e.stopImmediatePropagation?.();
          }
        }, true);
      })();
    </script>
